<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QUREVO — Standalone Reception Web App</title>
    <link rel="stylesheet" href="../unified-portal/styles.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo"><span class="cross">+</span> Reception Desk Web App</div>
    </header>
    <main class="content-container">
        <div class="card">
            <h2>Patient Registration & Token Generation</h2>
            <input type="text" placeholder="Patient Name" class="input-field">
            <input type="text" placeholder="MR Number" class="input-field">
            <button class="btn btn-primary" onclick="alert('Token Generated!')">Issue Token</button>
        </div>
    </main>
</body>
</html>
